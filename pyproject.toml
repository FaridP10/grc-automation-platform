[project]
name = "grc-platform"
version = "0.1.0"
description = "Integrated GRC automation platform: AWS posture monitoring, remediation (POA&M) automation, and policy gap analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "moto[all]>=5.0",
    "PyGithub>=2.3",
    "python-docx>=1.1",
    "pypdf>=4.3",
    "streamlit>=1.38",
    "python-dateutil>=2.9",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
